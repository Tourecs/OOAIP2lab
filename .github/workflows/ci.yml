name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - task-*
      - lab-*

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Find solutions
        id: find_sln
        shell: bash
        run: |
          slns=$(find . -name '*.sln' -not -path '*/obj/*' -not -path '*/bin/*' | sort)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$slns" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$slns" | grep -c '\.sln$' || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Restore
        if: steps.find_sln.outputs.count != '0'
        run: |
          for sln in ${{ steps.find_sln.outputs.files }}; do
            dotnet restore "$sln"
          done

      - name: Build
        if: steps.find_sln.outputs.count != '0'
        run: |
          for sln in ${{ steps.find_sln.outputs.files }}; do
            dotnet build "$sln" --configuration Release --no-restore
          done

      - name: Test with coverage
        if: steps.find_sln.outputs.count != '0'
        run: |
          for sln in ${{ steps.find_sln.outputs.files }}; do
            dotnet test "$sln" --configuration Release --no-build \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=cobertura \
              /p:CoverletOutput=../../coverage/ \
              /p:Threshold=80 \
              /p:ThresholdType=branch \
              /p:ThresholdStat=total \
              /p:MergeWith=../../coverage/coverage.cobertura.xml || true
          done

      - name: Install ReportGenerator
        if: steps.find_sln.outputs.count != '0'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: steps.find_sln.outputs.count != '0'
        run: |
          if [ -f coverage/coverage.cobertura.xml ]; then
            reportgenerator \
              -reports:coverage/coverage.cobertura.xml \
              -targetdir:coverage/report \
              -reporttypes:'MarkdownSummaryGithub;JsonSummary;HtmlInline_AzurePipelines'
          else
            echo "No coverage report found at coverage/coverage.cobertura.xml, skipping report generation."
          fi

      - name: Publish coverage comment
        if: steps.find_sln.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage/report/SummaryGithub.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Coverage summary was not generated.';
            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n## Coverage report\n\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload coverage artifact
        if: steps.find_sln.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
